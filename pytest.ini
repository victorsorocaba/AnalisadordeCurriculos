[pytest]
# Test discovery for the resume-analyzer-latex spec.
# Backend (FastAPI) and frontend (Streamlit) tests live in separate trees.
testpaths =
    backend/tests
    frontend/tests

# Make the workspace root importable so `backend` (a package) and the
# frontend modules can be imported from tests.
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*
